[package]
name = "OxidizedMyscelium"
version = "1.3.1"
edition = "2021"
description = "Core functionalities for the OxidizedMyscelium library."
authors = ["Cristian Camargo Filho <ccf@cdone.com.br>"]

[profile.release]
opt-level = 3

[build]
rustflags = ["-A", "warnings"]

[dev-dependencies]

[dependencies]
ctor = "0.2.8"
thiserror = "1.0.60"
oxidized_myscelium_macros = { path = "../oxidized_myscelium_macros" }
proc-macro2 = "1.0"
indexmap = { version = "2.2.3", features = ["serde"] }
syn = "2.0.61"
quote = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "*", features = ["bundled"] }
lazy_static = "1.4.0"
rand = "0.8.5"
chrono = "0.4"
ctrlc = "3.1.9"
parking_lot = { version = "0.12.2", features = ["deadlock_detection"] }
lock_api = "0.4"